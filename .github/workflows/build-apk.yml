name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Buildozer caches the Android SDK/NDK (~2 GB) between runs so that
      # subsequent builds finish in ~5 min instead of ~25 min.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Buildozer build artefacts
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: buildozer-local-${{ hashFiles('buildozer.spec') }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev \
            zlib1g-dev libtinfo5 \
            build-essential ccache autoconf libtool \
            libltdl-dev pkg-config

      - name: Install Buildozer + Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build debug APK
        run: buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Rename APK with git SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          SRC=$(ls bin/*.apk | head -1)
          DEST="bin/nutrienttracker-${SHA}-debug.apk"
          mv "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrienttracker-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # On a version tag (e.g. v1.0) also create a GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
