name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Buildozer caches the Android SDK/NDK (~2 GB) between runs so that
      # subsequent builds finish in ~5 min instead of ~25 min.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Buildozer build artefacts
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('**/*.py') }}
          restore-keys: buildozer-local-${{ hashFiles('buildozer.spec') }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            openjdk-17-jdk \
            build-essential ccache \
            libffi-dev libssl-dev \
            zlib1g-dev \
            autoconf automake libtool \
            pkg-config

      - name: Install Buildozer + Cython
        run: |
          pip install --upgrade pip
          pip install 'buildozer==1.5.0' 'cython==3.0.10'

      # Accept all Android SDK licenses and pre-install stable build-tools
      # This prevents buildozer from auto-selecting the RC build-tools (37-rc2)
      # whose license cannot be auto-accepted in a non-interactive shell.
      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" 2>/dev/null || true

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrienttracker-debug-apk
          path: bin/*.apk
          retention-days: 30

      # On a version tag (e.g. v1.0) also create a GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
